<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img">
<style>
.f{animation:fl 3s ease-in-out infinite}
.f2{animation:fl 3s ease-in-out .5s infinite}
.p{animation:pu 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes gw{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle cx="200" cy="34" r="46" fill="#0EA5EB" opacity=".07"/>
<circle cx="34" cy="150" r="34" fill="#062165" opacity=".06"/>

<rect x="38" y="36" width="92" height="116" rx="12" fill="#fff" stroke="#062165" stroke-width="3"/>
<rect x="52" y="52" width="64" height="30" rx="7" fill="#0EA5EB" class="p"/>
<rect x="52" y="92" width="64" height="8" rx="4" fill="#062165" opacity=".25"/>
<rect x="52" y="106" width="44" height="8" rx="4" fill="#062165" opacity=".25"/>
<rect x="52" y="124" width="36" height="12" rx="6" fill="#3BE3A0"/>
<g class="f">
<rect x="142" y="56" width="66" height="76" rx="10" fill="#fff" stroke="#062165" stroke-width="3"/>
<rect x="154" y="70" width="42" height="6" rx="3" fill="#062165" opacity=".25"/>
<rect x="154" y="84" width="42" height="24" rx="6" fill="#0EA5EB" opacity=".55"/>
<rect x="154" y="116" width="26" height="6" rx="3" fill="#062165" opacity=".25"/>
</g>
<g style="animation:sl 3.4s ease-in-out infinite">
<path d="M112 108l4 26 6-10 10 2-20-18Z" fill="#062165" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
</g>
</svg>