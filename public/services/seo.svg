<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img">
<style>
.f{animation:fl 3s ease-in-out infinite}
.f2{animation:fl 3s ease-in-out .5s infinite}
.p{animation:pu 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes gw{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle cx="200" cy="34" r="46" fill="#0EA5EB" opacity=".07"/>
<circle cx="34" cy="150" r="34" fill="#062165" opacity=".06"/>

<rect x="40" y="40" width="160" height="104" rx="12" fill="#fff" stroke="#062165" stroke-width="3"/>
<g transform="translate(58,126)">
<rect x="0" y="-26" width="14" height="26" rx="4" fill="#0EA5EB" opacity=".45" style="transform-origin:bottom;animation:gw 2.2s ease-in-out infinite"/>
<rect x="24" y="-44" width="14" height="44" rx="4" fill="#0EA5EB" opacity=".7" style="transform-origin:bottom;animation:gw 2.2s ease-in-out .3s infinite"/>
<rect x="48" y="-62" width="14" height="62" rx="4" fill="#0EA5EB" style="transform-origin:bottom;animation:gw 2.2s ease-in-out .6s infinite"/>
</g>
<path d="M62 92l26-20 22 14 32-30" fill="none" stroke="#3BE3A0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
 stroke-dasharray="120" stroke-dashoffset="120" style="animation:dr 2.4s ease-out infinite alternate"/>
<g class="f2">
<circle cx="156" cy="98" r="26" fill="#fff" fill-opacity=".9" stroke="#062165" stroke-width="5"/>
<path d="M175 117l16 16" stroke="#062165" stroke-width="7" stroke-linecap="round"/>
</g>
</svg>