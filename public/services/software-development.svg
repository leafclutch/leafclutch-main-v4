<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img">
<style>
.f{animation:fl 3s ease-in-out infinite}
.f2{animation:fl 3s ease-in-out .5s infinite}
.p{animation:pu 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes gw{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle cx="200" cy="34" r="46" fill="#0EA5EB" opacity=".07"/>
<circle cx="34" cy="150" r="34" fill="#062165" opacity=".06"/>

<g class="f">
<rect x="42" y="38" width="156" height="104" rx="12" fill="#fff" stroke="#062165" stroke-width="3"/>
<rect x="42" y="38" width="156" height="22" rx="12" fill="#062165"/>
<rect x="42" y="50" width="156" height="10" fill="#062165"/>
<circle cx="56" cy="49" r="3.5" fill="#FF5F57"/><circle cx="68" cy="49" r="3.5" fill="#F59E0B"/><circle cx="80" cy="49" r="3.5" fill="#3BE3A0"/>
<path d="M78 84 66 98l12 14" fill="none" stroke="#0EA5EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
 stroke-dasharray="60" stroke-dashoffset="60" style="animation:dr 1.6s ease-out infinite alternate"/>
<path d="M162 84l12 14-12 14" fill="none" stroke="#0EA5EB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
 stroke-dasharray="60" stroke-dashoffset="60" style="animation:dr 1.6s ease-out .2s infinite alternate"/>
<path d="M132 78l-24 42" stroke="#3BE3A0" stroke-width="5" stroke-linecap="round"/>
</g>
</svg>