<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img">
<style>
.f{animation:fl 3s ease-in-out infinite}
.f2{animation:fl 3s ease-in-out .5s infinite}
.p{animation:pu 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes gw{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle cx="200" cy="34" r="46" fill="#0EA5EB" opacity=".07"/>
<circle cx="34" cy="150" r="34" fill="#062165" opacity=".06"/>

<g class="f">
<rect x="40" y="36" width="160" height="90" rx="12" fill="#062165"/>
<path d="M104 62l34 19-34 19V62Z" fill="#fff" class="p"/>
</g>
<rect x="40" y="138" width="160" height="16" rx="8" fill="#EEF4FF"/>
<rect x="40" y="138" width="70" height="16" rx="8" fill="#0EA5EB"/>
<circle cx="110" cy="146" r="10" fill="#fff" stroke="#0EA5EB" stroke-width="4" style="animation:sl 3s ease-in-out infinite"/>
<g fill="#3BE3A0">
<rect x="48" y="104" width="6" height="14" rx="3" style="transform-origin:bottom;animation:gw 1.4s ease-in-out infinite"/>
<rect x="60" y="104" width="6" height="14" rx="3" style="transform-origin:bottom;animation:gw 1.4s ease-in-out .2s infinite"/>
<rect x="72" y="104" width="6" height="14" rx="3" style="transform-origin:bottom;animation:gw 1.4s ease-in-out .4s infinite"/>
</g>
</svg>