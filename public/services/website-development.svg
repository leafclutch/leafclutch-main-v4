<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img">
<style>
.f{animation:fl 3s ease-in-out infinite}
.f2{animation:fl 3s ease-in-out .5s infinite}
.p{animation:pu 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes gw{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle cx="200" cy="34" r="46" fill="#0EA5EB" opacity=".07"/>
<circle cx="34" cy="150" r="34" fill="#062165" opacity=".06"/>

<g class="f">
<rect x="36" y="34" width="168" height="112" rx="12" fill="#fff" stroke="#062165" stroke-width="3"/>
<rect x="36" y="34" width="168" height="24" rx="12" fill="#EEF4FF"/>
<rect x="36" y="46" width="168" height="12" fill="#EEF4FF"/>
<circle cx="50" cy="46" r="3.5" fill="#0EA5EB"/><circle cx="62" cy="46" r="3.5" fill="#0EA5EB" opacity=".5"/>
<rect x="76" y="41" width="112" height="10" rx="5" fill="#fff"/>
<rect x="48" y="70" width="60" height="60" rx="8" fill="#0EA5EB" class="p"/>
<rect x="118" y="70" width="70" height="12" rx="6" fill="#062165" opacity=".85"/>
<rect x="118" y="90" width="52" height="8" rx="4" fill="#062165" opacity=".3"/>
<rect x="118" y="105" width="64" height="8" rx="4" fill="#062165" opacity=".3"/>
<rect x="118" y="120" width="40" height="10" rx="5" fill="#3BE3A0"/>
</g>
</svg>