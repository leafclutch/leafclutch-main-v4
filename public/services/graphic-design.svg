<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180" role="img">
<style>
.f{animation:fl 3s ease-in-out infinite}
.f2{animation:fl 3s ease-in-out .5s infinite}
.p{animation:pu 2.4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pu{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes gw{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes sl{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle cx="200" cy="34" r="46" fill="#0EA5EB" opacity=".07"/>
<circle cx="34" cy="150" r="34" fill="#062165" opacity=".06"/>

<g class="f">
<path d="M112 34c-40 0-72 28-72 62 0 26 20 42 46 42 12 0 16-8 16-16 0-10 8-14 18-14h18c24 0 34-18 34-38 0-20-24-36-60-36Z" fill="#fff" stroke="#062165" stroke-width="3"/>
<circle cx="78" cy="76" r="9" fill="#0EA5EB" class="p"/>
<circle cx="104" cy="60" r="9" fill="#EC4899" style="animation:pu 2.4s ease-in-out .3s infinite"/>
<circle cx="134" cy="62" r="9" fill="#F59E0B" style="animation:pu 2.4s ease-in-out .6s infinite"/>
<circle cx="154" cy="84" r="9" fill="#3BE3A0" style="animation:pu 2.4s ease-in-out .9s infinite"/>
<circle cx="76" cy="106" r="9" fill="#062165" style="animation:pu 2.4s ease-in-out 1.2s infinite"/>
</g>
<g class="f2" transform="translate(150,104)">
<path d="M0 44 8 16 30 0l10 10-16 22-24 12Z" fill="#062165"/>
<path d="M8 16 24 32" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>